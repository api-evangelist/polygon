generated: '2026-07-22'
method: searched
source: npm, PyPI, Maven Central, Packagist, pkg.go.dev, github.com/massive-com registries and org
notes: >-
  Polygon.io rebranded to Massive in early 2026; SDK repos moved to the massive-com GitHub org
  (polygon-io URLs redirect). The JavaScript client is published under both the legacy
  @polygon.io/client-js name and the new @massive.com/client-js name. PyPI package
  "massive-api-client" is third-party (not first-party) and is excluded.
packages:
