    registry: npm
    name: "@massive.com/client-js"
    url: https://www.npmjs.com/package/@massive.com/client-js
    install: npm install @massive.com/client-js
    version: 10.7.0
    repository: https://github.com/massive-com/client-js
    official: true
  - language: javascript
    registry: npm
    name: "@polygon.io/client-js"
    url: https://www.npmjs.com/package/@polygon.io/client-js
    install: npm install @polygon.io/client-js
    version: 8.2.0
    repository: https://github.com/massive-com/client-js
    official: true
    note: Legacy package name from before the Massive rebrand
  - language: python
    registry: pypi
    name: polygon-api-client
    url: https://pypi.org/project/polygon-api-client/
    install: pip install polygon-api-client
    version: 1.16.3
    repository: https://github.com/massive-com/client-python
    official: true
  - language: go
    registry: pkg.go.dev
    name: github.com/polygon-io/client-go
    url: https://pkg.go.dev/github.com/polygon-io/client-go
