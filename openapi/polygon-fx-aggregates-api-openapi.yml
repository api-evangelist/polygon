      - description: The size of the time window.
        example: day
        in: path
        name: timespan
        required: true
        schema:
          enum:
          - second
          - minute
          - hour
          - day
          - week
          - month
          - quarter
          - year
          type: string
      - description: The start of the aggregate time window. Either a date with the format YYYY-MM-DD or a millisecond timestamp.
        example: '2025-11-03'
        in: path
        name: from
        required: true
        schema:
          type: string
      - description: The end of the aggregate time window. Either a date with the format YYYY-MM-DD or a millisecond timestamp.
        example: '2025-11-28'
        in: path
        name: to
        required: true
        schema:
          type: string
      - description: 'Whether or not the results are adjusted for splits.  By default, results are adjusted.

          Set this to false to get results that are NOT adjusted for splits.

          '
        example: true
        in: query
        name: adjusted
        schema:
          type: boolean
      - description: 'Sort the results by timestamp.

          `asc` will return results in ascending order (oldest at the top),

          `desc` will return results in descending order (newest at the top).

          '
        example: asc
        in: query
        name: sort
        schema:
          enum:
          - asc
          - desc
      - description: 'Limits the number of base aggregates queried to create the aggregate results. Max 50000 and Default 5000.

          Read more about how limit is used to calculate aggregate results in our article on

          <a href="https://massive.com/blog/aggs-api-updates/" target="_blank" alt="Aggregate Data API Improvements">Aggregate Data API Improvements</a>.

          '
        example: 120
        in: query
        name: limit
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              example:
                adjusted: true
                queryCount: 1
                request_id: 79c061995d8b627b736170bc9653f15d
                results:
                - c: 1.17721
                  h: 1.18305
                  l: 1.1756
                  n: 125329
                  o: 1.17921
                  t: 1626912000000
                  v: 125329
                  vw: 1.1789
                resultsCount: 1
                status: OK
                ticker: C:EURUSD
              schema:
                allOf:
                - properties:
                    ticker:
                      description: The exchange symbol that this item is traded under.
                      type: string
                  required:
                  - ticker
                  type: object
                - properties:
                    adjusted:
                      description: Whether or not this response was adjusted for splits.
                      type: boolean
                    queryCount:
                      description: The number of aggregates (minute or day) used to generate the response.
                      type: integer
                    request_id:
                      description: A request id assigned by the server.
                      type: string
                    resultsCount:
                      description: The total number of results for this request.
                      type: integer
                    status:
                      description: The status of this request's response.
                      type: string
                  required:
                  - status
                  - adjusted
                  - queryCount
                  - resultsCount
                  - request_id
                  type: object
                - properties:
                    results:
                      description: An array of results containing the requested data.
                      items:
                        properties:
                          c:
                            description: The close price for the symbol in the given time period.
                            format: double
                            type: number
                          h:
                            description: The highest price for the symbol in the given time period.
                            format: double
                            type: number
                          l:
                            description: The lowest price for the symbol in the given time period.
                            format: double
                            type: number
                          n:
                            description: The number of transactions in the aggregate window.
                            type: integer
                          o:
                            description: The open price for the symbol in the given time period.
                            format: double
                            type: number
                          t:
                            description: The Unix millisecond timestamp for the start of the aggregate window.
                            type: integer
                          v:
                            description: The trading volume of the symbol in the given time period.
                            format: double
                            type: number
                          vw:
                            description: The volume weighted average price.
                            format: double
                            type: number
                        required:
                        - o
                        - h
                        - l
                        - c
                        - v
                        - t
                        type: object
                      type: array
                  type: object
            text/csv:
              example: 'c,h,l,n,o,t,v,vw

                1.17721,1.18305,1.1756,125329,1.17921,1626912000000,125329,1.1789

                '
              schema:
                type: string
          description: Forex Aggregates.
        default:
          description: Unexpected error
      summary: Aggregates (Bars)
      tags:
      - fx:aggregates
      x-polygon-entitlement-data-type:
        description: Aggregate data
        name: aggregates
      x-polygon-entitlement-market-type:
        description: Forex data
        name: fx
