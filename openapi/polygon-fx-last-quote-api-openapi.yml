openapi: 3.2.0
info:
  description: The future of fintech.
  title: Polygon Fx:last:quote API
  version: 1.0.0
servers:
- description: Polygon Platform API
  url: https://api.polygon.io
- description: Polygon Platform API (Staging)
  url: https://api.staging.polygon.io
security:
- apiKey: []
tags:
- name: fx:last:quote
paths:
  /v1/last_quote/currencies/{from}/{to}:
    get:
      description: Get the last quote tick for a forex currency pair.
      operationId: LastQuoteCurrencies
      parameters:
      - description: The "from" symbol of the pair.
        example: AUD
        in: path
        name: from
        required: true
        schema:
          type: string
      - description: The "to" symbol of the pair.
        example: USD
        in: path
        name: to
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                last:
                  ask: 0.73124
                  bid: 0.73122
                  exchange: 48
                  timestamp: 1605557756000
                request_id: a73a29dbcab4613eeaf48583d3baacf0
                status: success
                symbol: AUD/USD
              schema:
                properties:
                  last:
                    description: Contains the requested quote data for the specified forex currency pair.
                    properties:
                      ask:
                        description: The ask price.
                        format: double
                        type: number
                      bid:
                        description: The bid price.
                        format: double
                        type: number
                      exchange:
                        description: The exchange ID. See <a href="https://massive.com/docs/rest/forex/market-operations/exchanges" alt="Exchanges">Exchanges</a> for Massive's mapping of exchange IDs.
                        type: integer
                      timestamp:
                        description: The Unix millisecond timestamp.
                        type: integer
                        x-polygon-go-type:
                          name: IMilliseconds
                          path: github.com/polygon-io/ptime
                    required:
                    - ask
                    - bid
                    - exchange
                    - timestamp
                    type: object
                    x-polygon-go-type:
                      name: LastQuoteCurrencies
                  request_id:
                    description: A request id assigned by the server.
                    type: string
                  status:
                    description: The status of this request's response.
                    type: string
                  symbol:
                    description: The symbol pair that was evaluated from the request.
                    type: string
                required:
                - status
                - request_id
                - symbol
                type: object
            text/csv:
              example: 'ask,bid,exchange,timestamp

                0.73124,0.73122,48,1605557756000

                '
              schema:
                type: string
          description: The last quote tick for this currency pair.
        default:
          description: Unexpected error
      summary: Last Quote for a Currency Pair
      tags:
      - fx:last:quote
      x-polygon-entitlement-data-type:
        description: NBBO data
        name: nbbo
      x-polygon-entitlement-market-type:
        description: Forex data
        name: fx
components:
  securitySchemes:
    apiKey:
      in: query
      name: apiKey
      type: apiKey
