  /v2/aggs/ticker/{indicesTicker}/prev:
    get:
      description: 'Get the previous day''s open, high, low, and close (OHLC) for the specified index.

        '
      operationId: GetPreviousIndicesAggregates
      parameters:
      - description: The ticker symbol of Index.
        example: I:NDX
        in: path
        name: indicesTicker
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                queryCount: 1
                request_id: b2170df985474b6d21a6eeccfb6bee67
                results:
                - T: I:NDX
                  c: 15070.14948566977
                  h: 15127.4195807999
                  l: 14946.7243781848
                  o: 15036.48391066877
                  t: 1687291200000
                resultsCount: 1
                status: OK
                ticker: I:NDX
              schema:
                allOf:
                - properties:
                    ticker:
                      description: The exchange symbol that this item is traded under.
                      type: string
                  required:
                  - ticker
                  type: object
                - properties:
                    queryCount:
                      description: The number of aggregates (minute or day) used to generate the response.
                      type: integer
                    request_id:
                      description: A request id assigned by the server.
                      type: string
                    resultsCount:
