  /v2/aggs/ticker/{indicesTicker}/range/{multiplier}/{timespan}/{from}/{to}:
    get:
      description: 'Get aggregate bars for an index over a given date range in custom time window sizes.

        <br />

        <br />

        For example, if timespan = ‘minute’ and multiplier = ‘5’ then 5-minute bars will be returned.

        '
      operationId: GetIndicesAggregates
      parameters:
      - description: The ticker symbol of Index.
        example: I:NDX
        in: path
        name: indicesTicker
        required: true
        schema:
          type: string
      - description: The size of the timespan multiplier.
        example: 1
        in: path
        name: multiplier
        required: true
        schema:
          type: integer
      - description: The size of the time window.
        example: day
        in: path
        name: timespan
        required: true
        schema:
          enum:
          - second
          - minute
          - hour
          - day
          - week
          - month
          - quarter
          - year
          type: string
      - description: The start of the aggregate time window. Either a date with the format YYYY-MM-DD or a millisecond timestamp.
        example: '2025-11-03'
        in: path
        name: from
        required: true
        schema:
          type: string
      - description: The end of the aggregate time window. Either a date with the format YYYY-MM-DD or a millisecond timestamp.
        example: '2025-11-28'
        in: path
        name: to
        required: true
        schema:
          type: string
      - description: 'Sort the results by timestamp.

          `asc` will return results in ascending order (oldest at the top),

          `desc` will return results in descending order (newest at the top).

          '
        example: asc
        in: query
        name: sort
        schema:
          enum:
          - asc
          - desc
      - description: 'Limits the number of base aggregates queried to create the aggregate results. Max 50000 and Default 5000.

          Read more about how limit is used to calculate aggregate results in our article on

          <a href="https://massive.com/blog/aggs-api-updates/" target="_blank" alt="Aggregate Data API Improvements">Aggregate Data API Improvements</a>.

          '
        example: 120
        in: query
        name: limit
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              example:
                count: 2
                queryCount: 2
                request_id: 0cf72b6da685bcd386548ffe2895904a
                results:
                - c: 11995.88235998666
                  h: 12340.44936267155
                  l: 11970.34221717375
                  o: 12230.83658266843
                  t: 1678341600000
                - c: 11830.28178808306
                  h: 12069.62262033557
                  l: 11789.85923449393
                  o: 12001.69552583921
                  t: 1678428000000
                status: OK
                ticker: I:NDX
              schema:
                allOf:
                - properties:
                    ticker:
                      description: The exchange symbol that this item is traded under.
                      type: string
                  required:
                  - ticker
                  type: object
                - properties:
                    queryCount:
                      description: The number of aggregates (minute or day) used to generate the response.
                      type: integer
                    request_id:
                      description: A request id assigned by the server.
                      type: string
                    resultsCount:
                      description: The total number of results for this request.
                      type: integer
                    status:
                      description: The status of this request's response.
                      type: string
                  required:
                  - status
                  - queryCount
                  - resultsCount
                  - request_id
                  type: object
                - properties:
                    results:
                      description: An array of results containing the requested data.
                      items:
                        properties:
                          c:
                            description: The close value for the symbol in the given time period.
                            format: double
                            type: number
                          h:
                            description: The highest value for the symbol in the given time period.
                            format: double
                            type: number
                          l:
                            description: The lowest value for the symbol in the given time period.
                            format: double
                            type: number
                          o:
                            description: The open value for the symbol in the given time period.
                            format: double
                            type: number
                          t:
                            description: The Unix millisecond timestamp for the start of the aggregate window.
                            type: integer
                        required:
                        - o
                        - h
                        - l
                        - c
                        - t
                        type: object
                      type: array
                  type: object
            text/csv:
              example: 'c,h,l,n,o,t

                11995.88235998666,12340.44936267155,11970.34221717375,12230.83658266843,1678341600000

                11830.28178808306,12069.62262033557,11789.85923449393,12001.69552583921,1678341600000

                '
              schema:
                type: string
          description: Index Aggregates.
        default:
          description: Unexpected error
