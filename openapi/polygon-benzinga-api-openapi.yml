      - description: Filter less than the value. Value must be an integer timestamp in seconds, formatted 'yyyy-mm-dd', or ISO 8601/RFC 3339 (e.g. '2024-05-28T20:27:41Z').
        in: query
        name: published.lt
        schema:
          type: string
      - description: Filter less than or equal to the value. Value must be an integer timestamp in seconds, formatted 'yyyy-mm-dd', or ISO 8601/RFC 3339 (e.g. '2024-05-28T20:27:41Z').
        in: query
        name: published.lte
        schema:
          type: string
      - description: Filter for arrays that contain the value.
        in: query
        name: channels
        schema:
          type: string
      - description: Filter for arrays that contain all of the values. Multiple values can be specified by using a comma separated list.
        in: query
        name: channels.all_of
        schema:
          type: string
      - description: Filter for arrays that contain any of the values. Multiple values can be specified by using a comma separated list.
        in: query
        name: channels.any_of
        schema:
          type: string
      - description: Filter for arrays that contain the value.
        in: query
        name: tags
